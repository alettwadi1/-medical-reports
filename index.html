<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام البلاغات الطبية الحرجة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:#F4F6F9;color:#2C3E50;min-height:100vh;direction:rtl}

/* TOPBAR */
.topbar{background:linear-gradient(135deg,#1A2980,#26D0CE);padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;color:#fff;box-shadow:0 2px 12px rgba(0,0,0,0.2);position:sticky;top:0;z-index:100}
.topbar-brand{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
.topbar-user{display:flex;align-items:center;gap:12px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:2px solid rgba(255,255,255,0.3)}
.notif-badge{background:#E74C3C;color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - 58px)}
.sidebar{width:230px;background:#fff;border-left:1px solid #E8ECEF;padding:16px 0;flex-shrink:0}
.sidebar-label{font-size:11px;color:#95A5A6;font-weight:700;padding:10px 16px 4px;text-transform:uppercase;letter-spacing:0.5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:13.5px;color:#5D6D7E;transition:all .15s;position:relative;border-right:3px solid transparent}
.nav-item:hover{background:#F8F9FA;color:#2C3E50}
.nav-item.active{background:#EAF4FB;color:#1A5276;font-weight:700;border-right-color:#1A5276}
.nav-icon{font-size:17px;width:22px;text-align:center}
.nav-count{margin-right:auto;background:#E74C3C;color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700}
.main{flex:1;padding:24px;overflow-y:auto}

/* CARDS */
.card{background:#fff;border-radius:12px;border:1px solid #E8ECEF;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:15px;font-weight:700;color:#2C3E50}
.card-subtitle{font-size:12px;color:#95A5A6;margin-top:2px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:18px}
.stat-card{background:#fff;border-radius:12px;border:1px solid #E8ECEF;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.stat-label{font-size:12px;color:#7F8C8D;margin-bottom:8px;font-weight:500}
.stat-value{font-size:28px;font-weight:700;line-height:1}
.stat-sub{font-size:11px;color:#95A5A6;margin-top:6px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-sent{background:#D6EAF8;color:#1A5276}
.badge-received{background:#D5F5E3;color:#1E8449}
.badge-unread{background:#FAE5D3;color:#E67E22}
.badge-critical{background:#FADBD8;color:#C0392B}
.badge-high{background:#FDE8D8;color:#A04000}
.badge-medium{background:#FEF9E7;color:#B7950B}
.badge-low{background:#EAFAF1;color:#1E8449}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;padding:11px 14px;font-size:11px;font-weight:700;color:#7F8C8D;border-bottom:2px solid #E8ECEF;background:#FAFBFC;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #F0F3F4;vertical-align:middle;color:#2C3E50}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFC}
tr.unread td{background:#FFFBF0}
tr.unread{border-right:3px solid #E67E22}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;font-family:'Cairo',sans-serif;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,#1A2980,#26D0CE);color:#fff;box-shadow:0 2px 8px rgba(26,41,128,0.25)}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,41,128,0.35)}
.btn-secondary{background:#F4F6F9;color:#5D6D7E;border:1px solid #E8ECEF}
.btn-secondary:hover{background:#E8ECEF}
.btn-success{background:#1E8449;color:#fff}
.btn-success:hover{background:#166039}
.btn-danger{background:#C0392B;color:#fff}
.btn-danger:hover{background:#A93226}
.btn-sm{padding:6px 14px;font-size:12px}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:12px;font-weight:700;color:#5D6D7E}
.req{color:#C0392B}
.form-control{padding:10px 14px;border:1.5px solid #E8ECEF;border-radius:8px;font-size:13px;font-family:'Cairo',sans-serif;color:#2C3E50;background:#fff;transition:border .15s;outline:none}
.form-control:focus{border-color:#26D0CE;box-shadow:0 0 0 3px rgba(38,208,206,0.12)}
.form-control[readonly]{background:#F8F9FA;color:#7F8C8D;cursor:default}
select.form-control{cursor:pointer}
textarea.form-control{resize:vertical;min-height:82px}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1A2980 0%,#26D0CE 100%);padding:20px}
.login-card{background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,0.2)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .icon{font-size:52px;display:block;margin-bottom:10px}
.login-logo h1{font-size:19px;font-weight:700;color:#1A2980;margin-bottom:4px}
.login-logo p{font-size:12px;color:#95A5A6}
.login-btn{width:100%;padding:13px;font-size:15px;background:linear-gradient(135deg,#1A2980,#26D0CE);color:#fff;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-weight:700;cursor:pointer;margin-top:4px;transition:opacity .15s}
.login-btn:hover{opacity:.9}
.login-err{background:#FADBD8;color:#C0392B;padding:10px 14px;border-radius:8px;font-size:13px;text-align:center;margin-bottom:14px;border:1px solid #F1948A}
.accounts-hint{background:#EBF5FB;border-radius:10px;padding:12px 14px;margin-top:16px;font-size:11px;color:#1A5276;border:1px solid #AED6F1}
.accounts-hint strong{display:block;margin-bottom:6px;font-size:12px;color:#1A2980}
.demo-acc{cursor:pointer;padding:4px 6px;border-radius:6px;transition:background .1s;margin-bottom:2px;display:block}
.demo-acc:hover{background:#D6EAF8}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:700px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,0.2)}
.modal-header{padding:22px 26px 0;display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;border-bottom:1px solid #E8ECEF;padding-bottom:16px}
.modal-body{padding:22px 26px 26px}
.modal-close{background:#F4F6F9;border:none;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:#7F8C8D;flex-shrink:0}
.modal-close:hover{background:#E8ECEF}

/* NOTIF PANEL */
.notif-panel{position:fixed;top:58px;left:20px;width:330px;background:#fff;border-radius:12px;border:1px solid #E8ECEF;box-shadow:0 8px 32px rgba(0,0,0,0.12);z-index:200;overflow:hidden;display:none}
.notif-panel.open{display:block;animation:slideDown .2s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.notif-header{padding:14px 16px;border-bottom:1px solid #E8ECEF;display:flex;align-items:center;justify-content:space-between;background:#FAFBFC}
.notif-item{padding:13px 16px;border-bottom:1px solid #F0F3F4;cursor:pointer;transition:background .1s}
.notif-item:hover{background:#F8F9FA}
.notif-item.unread{background:#FFFBF0;border-right:3px solid #E67E22}
.notif-title{font-size:13px;font-weight:700;color:#2C3E50;margin-bottom:3px}
.notif-time{font-size:11px;color:#95A5A6}
.notif-dot{width:7px;height:7px;border-radius:50%;background:#E67E22;display:inline-block;margin-left:6px;vertical-align:middle}

/* DETAIL */
.detail-section{border-top:1px solid #E8ECEF;padding-top:16px;margin-top:16px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.detail-item{display:flex;flex-direction:column;gap:4px}
.detail-label{font-size:11px;color:#7F8C8D;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.detail-value{font-size:13px;font-weight:600;color:#2C3E50}
.critical-box{background:#FDF2F2;border:1.5px solid #F1948A;border-radius:10px;padding:14px 16px;margin-top:14px}
.critical-box .label{font-size:11px;font-weight:700;color:#C0392B;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.3px}
.critical-box .val{font-size:19px;font-weight:700;color:#C0392B;margin-bottom:8px;line-height:1.3}

/* TABS */
.tabs{display:flex;gap:2px;border-bottom:2px solid #E8ECEF;margin-bottom:18px}
.tab{padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:#7F8C8D;transition:all .15s;font-family:'Cairo',sans-serif;background:none;border-top:none;border-left:none;border-right:none}
.tab.active{color:#1A5276;border-bottom-color:#1A5276;font-weight:700}
.tab:hover:not(.active){color:#2C3E50}

/* ALERT */
.alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.alert-success{background:#D5F5E3;color:#1E8449;border:1px solid #A9DFBF}
.alert-warning{background:#FAE5D3;color:#E67E22;border:1px solid #FAD7A0}
.alert-info{background:#D6EAF8;color:#1A5276;border:1px solid #AED6F1}

/* BAR CHART */
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar-label{font-size:12px;color:#5D6D7E;width:130px;text-align:right;flex-shrink:0;font-weight:500}
.bar-track{flex:1;background:#F0F3F4;border-radius:6px;height:22px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding:0 10px;font-size:11px;color:#fff;font-weight:700;transition:width .6s ease;min-width:24px}

/* REPORT NUMBER */
.report-no{font-family:monospace;background:#EBF5FB;color:#1A5276;padding:3px 9px;border-radius:5px;font-size:12px;font-weight:700;border:1px solid #AED6F1}

/* EMPTY STATE */
.empty-state{text-align:center;padding:48px 20px;color:#95A5A6}
.empty-state .icon{font-size:44px;display:block;margin-bottom:12px}
.empty-state p{font-size:14px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:#2C3E50;color:#fff;padding:13px 20px;border-radius:10px;font-size:13px;font-family:'Cairo',sans-serif;z-index:999;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.2);max-width:320px}

/* SECTION HEADING */
.page-header{margin-bottom:20px}
.page-header h2{font-size:18px;font-weight:700;color:#2C3E50;margin-bottom:4px}
.page-header p{font-size:13px;color:#7F8C8D}

/* USER MANAGEMENT */
.user-card{background:#fff;border:1px solid #E8ECEF;border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:14px;transition:box-shadow .15s;margin-bottom:10px}
.user-card:hover{box-shadow:0 2px 12px rgba(0,0,0,0.07)}
.user-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
.ua-admin{background:#FADBD8;color:#C0392B}
.ua-hospital{background:#D6EAF8;color:#1A5276}
.ua-center{background:#D5F5E3;color:#1E8449}
.user-info{flex:1;min-width:0}
.user-name{font-size:14px;font-weight:700;color:#2C3E50;margin-bottom:2px}
.user-meta{font-size:12px;color:#7F8C8D}
.user-actions{display:flex;gap:6px;flex-shrink:0}
.modal-sm{max-width:480px}
.form-section-title{font-size:13px;font-weight:700;color:#5D6D7E;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid #E8ECEF}
.delete-confirm{background:#FDF2F2;border:1.5px solid #F1948A;border-radius:10px;padding:14px 16px;margin-top:12px;text-align:center}

@media(max-width:768px){.form-grid{grid-template-columns:1fr}.sidebar{width:190px}.stats-grid{grid-template-columns:1fr 1fr}.detail-grid{grid-column:1fr}}
@media(max-width:560px){.sidebar{display:none}.main{padding:16px}}
</style>
</head>
<body>

<div id="root"></div>
<div id="toast" class="toast"></div>

<script>
// ===================== DATABASE =====================
const DB = {
  hospitals:[
    {id:1,name:'مستشفى الملك فهد العام'},
    {id:2,name:'مستشفى الأمير محمد بن عبدالعزيز'},
  ],
  centers:[
    {id:1,hospitalId:1,name:'مركز صحي الخالدية'},
    {id:2,hospitalId:1,name:'مركز صحي الروضة'},
    {id:3,hospitalId:1,name:'مركز صحي الأندلس'},
    {id:4,hospitalId:2,name:'مركز صحي الصفاء'},
    {id:5,hospitalId:2,name:'مركز صحي النخيل'},
  ],
  users:[
    {id:1,username:'admin',password:'admin123',name:'أحمد الزهراني',role:'admin',hospitalId:1,centerId:null},
    {id:2,username:'hosp1',password:'hosp123',name:'سارة القحطاني',role:'hospital_staff',hospitalId:1,centerId:null},
    {id:3,username:'center1',password:'center123',name:'محمد الغامدي',role:'center_staff',hospitalId:1,centerId:1},
    {id:4,username:'center2',password:'center456',name:'نورة العمري',role:'center_staff',hospitalId:1,centerId:2},
    {id:5,username:'hosp2',password:'hosp456',name:'خالد الدوسري',role:'hospital_staff',hospitalId:2,centerId:null},
    {id:6,username:'center4',password:'cen456',name:'ريم الشهري',role:'center_staff',hospitalId:2,centerId:4},
  ],
  reports:[
    {id:1,reportNo:'CR-2024-0001',patientName:'عبدالله المطيري',fileNo:'MF-44231',idNo:'1234567890',testName:'تعداد الدم الشامل - WBC',criticalResult:'WBC: 0.5 x10³/µL (قيمة حرجة)',severity:'critical',notes:'المريض يعاني من نقص حاد في كريات الدم البيضاء',hospitalId:1,centerId:1,reporterName:'سارة القحطاني',labTech:'د. فاطمة السلمي',date:'2024-11-15',time:'09:32',status:'received',viewedAt:'2024-11-15 10:05',viewedBy:'محمد الغامدي'},
    {id:2,reportNo:'CR-2024-0002',patientName:'فاطمة العتيبي',fileNo:'MF-58901',idNo:'',testName:'جلوكوز الدم العشوائي',criticalResult:'Glucose: 48 mg/dL (منخفض جداً)',severity:'critical',notes:'يستدعي تدخلاً فورياً',hospitalId:1,centerId:2,reporterName:'سارة القحطاني',labTech:'د. سعد الحارثي',date:'2024-11-16',time:'11:20',status:'sent',viewedAt:null,viewedBy:null},
    {id:3,reportNo:'CR-2024-0003',patientName:'خالد الشمري',fileNo:'MF-71245',idNo:'1098765432',testName:'البوتاسيوم في الدم',criticalResult:'K+: 6.8 mEq/L (مرتفع حرجاً)',severity:'high',notes:'خطر على القلب - مراقبة فورية',hospitalId:1,centerId:1,reporterName:'سارة القحطاني',labTech:'د. فاطمة السلمي',date:'2024-11-16',time:'14:15',status:'sent',viewedAt:null,viewedBy:null},
    {id:4,reportNo:'CR-2024-0004',patientName:'نورة الزهراني',fileNo:'MF-32190',idNo:'1176543210',testName:'الصفائح الدموية',criticalResult:'PLT: 18 x10³/µL (حرجة منخفضة)',severity:'critical',notes:'خطر نزيف عالي',hospitalId:2,centerId:4,reporterName:'خالد الدوسري',labTech:'د. منى العمري',date:'2024-11-17',time:'08:45',status:'received',viewedAt:'2024-11-17 09:10',viewedBy:'ريم الشهري'},
    {id:5,reportNo:'CR-2024-0005',patientName:'سعود الحربي',fileNo:'MF-65432',idNo:'',testName:'الكرياتينين',criticalResult:'Creatinine: 8.2 mg/dL (فشل كلوي)',severity:'high',notes:'يحتاج غسيل كلى فوري',hospitalId:1,centerId:3,reporterName:'سارة القحطاني',labTech:'د. سعد الحارثي',date:'2024-11-17',time:'10:30',status:'sent',viewedAt:null,viewedBy:null},
    {id:6,reportNo:'CR-2024-0006',patientName:'مريم الغامدي',fileNo:'MF-89012',idNo:'1254321098',testName:'معدل الترسب - ESR',criticalResult:'ESR: 142 mm/hr',severity:'medium',notes:'',hospitalId:1,centerId:2,reporterName:'سارة القحطاني',labTech:'د. فاطمة السلمي',date:'2024-11-18',time:'07:50',status:'received',viewedAt:'2024-11-18 08:30',viewedBy:'نورة العمري'},
  ],
  auditLogs:[],
  nextId:7,
  nextNum:7,
};

// ===================== STATE =====================
let S = {
  user:null,view:'login',selectedReport:null,
  filterStatus:'all',showNotif:false,
  loginErr:'',successMsg:'',reportForm:{},
  userModal:null,userForm:{},userFormErr:'',
  entityModal:null,entityForm:{},entityFormErr:'',
};

// ===================== HELPERS =====================
const hosp=(id)=>DB.hospitals.find(h=>h.id===id);
const center=(id)=>DB.centers.find(c=>c.id===id);
const pad=(n)=>String(n).padStart(2,'0');
const nowDate=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const nowTime=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const nowDT=()=>nowDate()+' '+nowTime();
const genNo=()=>'CR-2024-'+String(DB.nextNum).padStart(4,'0');
const sevLabel=(s)=>({critical:'حرج جداً',high:'عالي',medium:'متوسط',low:'منخفض'}[s]||s);
const sevBadge=(s)=>`<span class="badge badge-${s}">${sevLabel(s)}</span>`;
const stBadge=(s)=>({sent:'<span class="badge badge-sent">مرسل</span>',received:'<span class="badge badge-received">تم الاستلام</span>'}[s]||s);
const roleLabel=(r)=>({admin:'مدير النظام',hospital_staff:'موظف مستشفى',center_staff:'موظف مركز'}[r]||r);

function userReports(u){
  let r=DB.reports.filter(rep=>rep.hospitalId===u.hospitalId);
  if(u.role==='center_staff') r=r.filter(rep=>rep.centerId===u.centerId);
  return r;
}
function unreadCount(u){return userReports(u).filter(r=>r.status==='sent').length;}
function diffMins(date,time,dt2){
  if(!dt2)return null;
  const d1=new Date(date+'T'+time);
  const [d2d,d2t]=dt2.split(' ');
  const d2=new Date(d2d+'T'+d2t);
  return Math.round((d2-d1)/60000);
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}
function playBeep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=880;o.type='sine';
    g.gain.setValueAtTime(0.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
    o.start();o.stop(ctx.currentTime+0.5);
  }catch(e){}
}
function addLog(action,details){
  if(!S.user)return;
  DB.auditLogs.unshift({id:DB.auditLogs.length+1,action,userName:S.user.name,userRole:S.user.role,details,ts:nowDT()});
}
function saveData(){
  try{localStorage.setItem('medReports',JSON.stringify({reports:DB.reports,nextId:DB.nextId,nextNum:DB.nextNum,auditLogs:DB.auditLogs,users:DB.users,hospitals:DB.hospitals,centers:DB.centers}));}catch(e){}
}
function loadData(){
  try{
    const d=localStorage.getItem('medReports');
    if(d){const p=JSON.parse(d);DB.reports=p.reports;DB.nextId=p.nextId;DB.nextNum=p.nextNum;DB.auditLogs=p.auditLogs||[];if(p.users&&p.users.length>0)DB.users=p.users;if(p.hospitals&&p.hospitals.length>0)DB.hospitals=p.hospitals;if(p.centers&&p.centers.length>0)DB.centers=p.centers;}
  }catch(e){}
}

  return `

    <div class="stat-card"><div class="stat-label">بلاغات معلقة</div><div class="stat-value" style="color:#E67E22">${sent}</div><div class="stat-sub">لم يتم الاطلاع</div></div>
    <div class="stat-card"><div class="stat-label">تم الاستلام</div><div class="stat-value" style="color:#1E8449">${recv}</div><div class="stat-sub">مؤكدة</div></div>
    <div class="stat-card"><div class="stat-label">متوسط الاستجابة</div><div class="stat-value" style="color:#C0392B">${avg}</div><div class="stat-sub">دقيقة</div></div>
  </div>
  <div class="card">
    <div class="card-header">
      <div><div class="card-title">أحدث البلاغات</div><div class="card-subtitle">آخر 6 بلاغات</div></div>
      <button class="btn btn-primary btn-sm" data-view="new-report">➕ بلاغ جديد</button>
    </div>
    <div class="table-wrap"><table>
      <tr><th>رقم البلاغ</th><th>المريض</th><th>التحليل</th><th>الخطورة</th><th>المركز</th><th>الحالة</th><th>التاريخ</th></tr>

        <td style="font-size:12px;color:${r.viewedAt?'#1E8449':'#95A5A6'}">${r.viewedAt||'—'}</td>
        <td style="font-size:12px;font-weight:${late?'700':'400'};color:${mins!==null?(late?'#C0392B':'#1E8449'):'#95A5A6'}">${mins!==null?mins+' د':'—'}</td>
        <td><button class="btn btn-secondary btn-sm" onclick="openReport(${r.id})">عرض</button></td>
      </tr>`;}).join('')}
  </table></div></div>`;
}

// STATS
function renderStats(){
  const u=S.user,all=userReports(u);
  const byCenter={};
  DB.centers.filter(c=>c.hospitalId===u.hospitalId).forEach(c=>{
    const cr=all.filter(r=>r.centerId===c.id);
    byCenter[c.id]={name:c.name,total:cr.length,sent:cr.filter(r=>r.status==='sent').length,recv:cr.filter(r=>r.status==='received').length};
  });
  const maxV=Math.max(...Object.values(byCenter).map(b=>b.total),1);
  const allMins=all.filter(r=>r.viewedAt).map(r=>diffMins(r.date,r.time,r.viewedAt)).filter(m=>m!==null);
  const avg=allMins.length?Math.round(allMins.reduce((a,b)=>a+b,0)/allMins.length):0;
  const delayed=all.filter(r=>{if(!r.viewedAt)return false;return diffMins(r.date,r.time,r.viewedAt)>30;});
  const pctRecv=all.length?Math.round(all.filter(r=>r.status==='received').length/all.length*100):0;
  return `
  <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between">

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">إجمالي البلاغات</div><div class="stat-value" style="color:#1A5276">${all.length}</div></div>
    <div class="stat-card"><div class="stat-label">نسبة الاستلام</div><div class="stat-value" style="color:#1E8449">${pctRecv}%</div></div>
    <div class="stat-card"><div class="stat-label">متوسط الاستجابة</div><div class="stat-value" style="color:#E67E22">${avg} د</div></div>
    <div class="stat-card"><div class="stat-label">بلاغات متأخرة (+30د)</div><div class="stat-value" style="color:#C0392B">${delayed.length}</div></div>
  </div>
  <div class="card">
    <div class="card-title" style="margin-bottom:16px">البلاغات حسب المركز الصحي</div>

          <div class="detail-item"><div class="detail-label">المركز المستهدف</div><div class="detail-value">${center(r.centerId)?.name}</div></div>
          <div class="detail-item"><div class="detail-label">الموظف المبلغ</div><div class="detail-value">${r.reporterName}</div></div>
          <div class="detail-item"><div class="detail-label">موظف المختبر</div><div class="detail-value">${r.labTech}</div></div>
          <div class="detail-item"><div class="detail-label">تاريخ الإرسال</div><div class="detail-value">${r.date}</div></div>
          <div class="detail-item"><div class="detail-label">وقت الإرسال</div><div class="detail-value">${r.time}</div></div>
        </div>
      </div>
      ${r.viewedAt?`<div class="detail-section">
        <div style="font-weight:700;font-size:13px;margin-bottom:12px">✅ بيانات الاستلام</div>
        <div class="detail-grid">
          <div class="detail-item"><div class="detail-label">تاريخ الاطلاع</div><div class="detail-value">${r.viewedAt.split(' ')[0]}</div></div>
          <div class="detail-item"><div class="detail-label">وقت الاطلاع</div><div class="detail-value">${r.viewedAt.split(' ')[1]}</div></div>
          <div class="detail-item"><div class="detail-label">اطلع عليه</div><div class="detail-value">${r.viewedBy}</div></div>
          ${mins!==null?`<div class="detail-item"><div class="detail-label">مدة الاستجابة</div><div class="detail-value" style="color:${mins>30?'#C0392B':'#1E8449'}">${mins} دقيقة ${mins>30?'⚠️ متأخر':'✅ في الوقت'}</div></div>`:''}
        </div>
      </div>`:''}
      ${r.notes?`<div class="detail-section"><div style="font-weight:700;font-size:13px;margin-bottom:8px">📝 ملاحظات</div><div style="background:#F8F9FA;padding:12px 16px;border-radius:8px;font-size:13px;line-height:1.7;border:1px solid #E8ECEF">${r.notes}</div></div>`:''}
      ${canAck?`<div style="margin-top:22px;text-align:center">
        <button class="btn btn-success" id="btn-ack" style="padding:12px 32px;font-size:14px">✅ تم الاطلاع على البلاغ</button>
        <div style="font-size:11px;color:#7F8C8D;margin-top:8px">سيتم تسجيل اسمك والتوقيت تلقائياً</div>
      </div>`:''}
    </div>
  </div></div>`;
}

// ===================== EVENTS =====================
function bindEvents(){
  // Login
  document.getElementById('btn-login')?.addEventListener('click',doLogin);
  document.getElementById('inp-pass')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  // Logout
  document.getElementById('btn-logout')?.addEventListener('click',()=>{
    addLog('تسجيل خروج',`${S.user.name} خرج من النظام`);
    S.user=null;S.view='login';S.loginErr='';S.showNotif=false;render();
  });
  // Notif
  document.getElementById('notif-btn')?.addEventListener('click',e=>{
    e.stopPropagation();S.showNotif=!S.showNotif;render();
  });
  document.addEventListener('click',e=>{
    if(S.showNotif&&!e.target.closest('#notif-panel')&&!e.target.closest('#notif-btn')){
      S.showNotif=false;render();
    }
  },{once:true});
  // Nav
  document.querySelectorAll('.nav-item[data-view]').forEach(el=>{
    el.addEventListener('click',()=>{S.view=el.dataset.view;S.successMsg='';S.showNotif=false;render();});
  });
  document.querySelectorAll('button[data-view]').forEach(el=>{
    el.addEventListener('click',()=>{S.view=el.dataset.view;render();});
  });
  // Tabs
  document.querySelectorAll('.tab[data-filter]').forEach(el=>{
    el.addEventListener('click',()=>{S.filterStatus=el.dataset.filter;render();});
  });
  // Form
  document.getElementById('btn-send')?.addEventListener('click',submitReport);
  document.getElementById('btn-clear')?.addEventListener('click',()=>{S.reportForm={};render();});
  // Modal
  document.getElementById('modal-close')?.addEventListener('click',()=>{S.selectedReport=null;render();});
  document.getElementById('modal-overlay')?.addEventListener('click',e=>{
    if(e.target.id==='modal-overlay'){S.selectedReport=null;render();}
  });
  document.getElementById('btn-ack')?.addEventListener('click',acknowledgeReport);
  // User management
  document.getElementById('btn-add-user')?.addEventListener('click',()=>{S.userModal='add';S.userForm={};S.userFormErr='';render();});
  document.getElementById('umodal-close')?.addEventListener('click',()=>{S.userModal=null;S.userForm={};render();});
  document.getElementById('umodal-close2')?.addEventListener('click',()=>{S.userModal=null;S.userForm={};render();});
  document.getElementById('user-modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='user-modal-overlay'){S.userModal=null;S.userForm={};render();}});
  document.getElementById('btn-save-user')?.addEventListener('click',saveUser);
  document.getElementById('btn-confirm-delete')?.addEventListener('click',confirmDeleteUser);
  // Hospitals & Centers management
  document.getElementById('btn-add-hosp')?.addEventListener('click',()=>{S.entityModal={type:'hosp'};S.entityForm={};S.entityFormErr='';render();});
  document.getElementById('btn-add-center')?.addEventListener('click',()=>{S.entityModal={type:'center'};S.entityForm={};S.entityFormErr='';render();});
  document.getElementById('emodal-close')?.addEventListener('click',()=>{S.entityModal=null;S.entityForm={};render();});
  document.getElementById('emodal-close2')?.addEventListener('click',()=>{S.entityModal=null;S.entityForm={};render();});
  document.getElementById('entity-modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='entity-modal-overlay'){S.entityModal=null;S.entityForm={};render();}});
  document.getElementById('btn-save-entity')?.addEventListener('click',saveEntity);
  document.getElementById('btn-confirm-entity-delete')?.addEventListener('click',confirmDeleteEntity);
}

function doLogin(){
  const u=document.getElementById('inp-user')?.value.trim();
  const p=document.getElementById('inp-pass')?.value.trim();
  const user=DB.users.find(x=>x.username===u&&x.password===p);
  if(!user){S.loginErr='اسم المستخدم أو كلمة المرور غير صحيحة';render();return;}
  S.user=user;S.view=user.role==='center_staff'?'center-inbox':'dashboard';S.loginErr='';
  addLog('تسجيل دخول',`دخل ${user.name} (${roleLabel(user.role)}) إلى النظام`);
  saveData();render();
}

function submitReport(){
  const u=S.user;
  const get=id=>document.getElementById(id)?.value.trim();
  const patient=get('f-patient'),fileNo=get('f-fileno'),idNo=get('f-idno');
  const test=get('f-test'),result=get('f-result'),sev=get('f-sev');
  const centerId=get('f-center'),notes=get('f-notes'),labtech=get('f-labtech');
  if(!patient||!fileNo||!test||!result||!sev||!centerId||!labtech){
    toast('⚠️ يرجى ملء جميع الحقول المطلوبة');return;
  }
  const rNo=genNo();
  const newR={id:DB.nextId++,reportNo:rNo,patientName:patient,fileNo,idNo,testName:test,criticalResult:result,severity:sev,notes,hospitalId:u.hospitalId,centerId:parseInt(centerId),reporterName:u.name,labTech:labtech,date:nowDate(),time:nowTime(),status:'sent',viewedAt:null,viewedBy:null};
  DB.reports.unshift(newR);DB.nextNum++;
  addLog('إرسال بلاغ',`أُرسل البلاغ ${rNo} للمريض ${patient} إلى ${center(parseInt(centerId))?.name}`);
  saveData();playBeep();
  S.reportForm={};S.successMsg=`تم إرسال البلاغ ${rNo} بنجاح وإشعار ${center(parseInt(centerId))?.name}`;
  S.view='reports';render();
}

function openReport(id){
  S.selectedReport=DB.reports.find(r=>r.id===id);
  S.showNotif=false;render();
}

function acknowledgeReport(){
  const r=S.selectedReport;if(!r)return;
  r.status='received';r.viewedAt=nowDT();r.viewedBy=S.user.name;
  addLog('تأكيد استلام',`اطلع على البلاغ ${r.reportNo} للمريض ${r.patientName}`);
  saveData();toast('✅ تم تسجيل الاطلاع بنجاح');
  S.selectedReport=r;render();
}

function doExport(type){
  toast(`جاري تصدير التقرير بصيغة ${type.toUpperCase()}...`);
  addLog('تصدير تقرير',`تصدير بصيغة ${type.toUpperCase()}`);saveData();
}

// ===================== USER MANAGEMENT FUNCTIONS =====================
function openEditUser(id){
  const u=DB.users.find(x=>x.id===id);
  if(!u)return;
  S.userModal={editId:id};
  S.userForm={name:u.name,username:u.username,role:u.role,hospitalId:u.hospitalId,centerId:u.centerId};
  S.userFormErr='';render();
}
function openDeleteUser(id){
  S.userModal={deleteId:id};S.userFormErr='';render();
}
function onRoleChange(){
  const role=document.getElementById('uf-role')?.value;
  const cg=document.getElementById('center-group');
  if(cg) cg.style.display=role==='center_staff'?'flex':'none';
}
function onHospChange(){
  const hospId=document.getElementById('uf-hosp')?.value;
  const centerSel=document.getElementById('uf-center');
  if(!centerSel)return;
  const centers=DB.centers.filter(c=>c.hospitalId==hospId);
  centerSel.innerHTML='<option value="">-- اختر المركز --</option>'+centers.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}
function saveUser(){
  const isEdit=S.userModal?.editId;
  const get=id=>document.getElementById(id)?.value.trim();
  const name=get('uf-name'),username=get('uf-username'),pass=get('uf-pass');
  const role=get('uf-role'),hospId=parseInt(get('uf-hosp')),centerId=parseInt(get('uf-center'))||null;
  if(!name||!username||!role||!hospId){S.userFormErr='يرجى ملء جميع الحقول المطلوبة';render();return;}
  if(!isEdit&&!pass){S.userFormErr='كلمة المرور مطلوبة للمستخدم الجديد';render();return;}
  if(role==='center_staff'&&!centerId){S.userFormErr='يجب تحديد المركز الصحي لموظف المركز';render();return;}
  // Check duplicate username
  const dupCheck=DB.users.find(u=>u.username===username&&u.id!==(isEdit||0));
  if(dupCheck){S.userFormErr='اسم المستخدم مستخدم مسبقاً، اختر اسماً آخر';render();return;}
  if(isEdit){
    const u=DB.users.find(x=>x.id===isEdit);
    if(!u)return;
    u.name=name;u.username=username;u.role=role;u.hospitalId=hospId;
    u.centerId=role==='center_staff'?centerId:null;
    if(pass) u.password=pass;
    addLog('تعديل مستخدم',`تم تعديل بيانات المستخدم: ${name} (${username})`);
    toast('✅ تم حفظ التعديلات بنجاح');
  } else {
    const newU={id:Math.max(...DB.users.map(u=>u.id))+1,name,username,password:pass,role,hospitalId:hospId,centerId:role==='center_staff'?centerId:null};
    DB.users.push(newU);
    addLog('إضافة مستخدم',`تم إضافة مستخدم جديد: ${name} (${username}) بصلاحية ${roleLabel(role)}`);
    toast('✅ تم إضافة المستخدم بنجاح');
  }
  saveData();S.userModal=null;S.userForm={};render();
}
function confirmDeleteUser(){
  const id=S.userModal?.deleteId;
  const u=DB.users.find(x=>x.id===id);
  if(!u)return;
  DB.users.splice(DB.users.indexOf(u),1);
  addLog('حذف مستخدم',`تم حذف المستخدم: ${u.name} (${u.username})`);
  saveData();toast('تم حذف المستخدم');
  S.userModal=null;render();
}

// ===================== ENTITY MANAGEMENT FUNCTIONS =====================
function openEditEntity(type,id){
  S.entityModal={type,editId:id};
  const item=type==='hosp'?DB.hospitals.find(x=>x.id===id):DB.centers.find(x=>x.id===id);
  S.entityForm=item?{name:item.name,hospitalId:item.hospitalId||null}:{};
  S.entityFormErr='';render();
}
function openDeleteEntity(type,id){
  S.entityModal={type,deleteId:id};S.entityFormErr='';render();
}
function saveEntity(){
  const m=S.entityModal;
  const isHosp=m.type==='hosp';
  const isEdit=!!m.editId;
  const name=document.getElementById('ef-name')?.value.trim();
  const hospId=isHosp?null:parseInt(document.getElementById('ef-hosp')?.value||0);
  if(!name){S.entityFormErr='يرجى إدخال الاسم';render();return;}
  if(!isHosp&&!hospId){S.entityFormErr='يرجى تحديد المستشفى';render();return;}
  // duplicate check
  const list=isHosp?DB.hospitals:DB.centers;
  const dup=list.find(x=>x.name===name&&x.id!==(isEdit?m.editId:0));
  if(dup){S.entityFormErr='هذا الاسم موجود مسبقاً';render();return;}
  if(isEdit){
    const item=list.find(x=>x.id===m.editId);
    if(!item)return;
    item.name=name;
    if(!isHosp) item.hospitalId=hospId;
    addLog(`تعديل ${isHosp?'مستشفى':'مركز'}`,`تم تعديل: ${name}`);
    toast('✅ تم حفظ التعديلات');
  } else {
    const newId=Math.max(0,...list.map(x=>x.id))+1;
    if(isHosp){
      DB.hospitals.push({id:newId,name});
    } else {
      DB.centers.push({id:newId,hospitalId:hospId,name});
    }
    addLog(`إضافة ${isHosp?'مستشفى':'مركز'}`,`تمت الإضافة: ${name}`);
    toast(`✅ تمت إضافة ${isHosp?'المستشفى':'المركز'} بنجاح`);
  }
  saveData();S.entityModal=null;S.entityForm={};render();
}
function confirmDeleteEntity(){
  const m=S.entityModal;
  const isHosp=m.type==='hosp';
  const list=isHosp?DB.hospitals:DB.centers;
  const item=list.find(x=>x.id===m.deleteId);
  if(!item)return;
  list.splice(list.indexOf(item),1);
  addLog(`حذف ${isHosp?'مستشفى':'مركز'}`,`تم حذف: ${item.name}`);
  saveData();toast('تم الحذف بنجاح');
  S.entityModal=null;render();
}

// ===================== INIT =====================
loadData();render();
</script>
